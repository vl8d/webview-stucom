<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte Monnaie · stucom</title>
<meta name="description" content="Compte tes pièces et billets d'un clic, avec total et historique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --grey:  #888;
    --mid:   #1a1a1a;
    --line:  #252525;
    --accent: #EFBF04;
  }
  html, body { height: 100%; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    padding: 1.5rem 1.25rem 3rem;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  .backlink {
    display: inline-block;
    color: var(--grey);
    text-decoration: none;
    font-size: .75rem;
    letter-spacing: .05em;
    margin-bottom: 1.5rem;
  }
  .backlink:hover { color: var(--white); }

  header { text-align: center; margin-bottom: 2rem; }
  #app-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    letter-spacing: .1em;
    color: var(--white);
  }
  #app-sub {
    font-size: .68rem;
    color: var(--grey);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-top: .3rem;
  }

  h3.section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: .08em;
    color: var(--grey);
    margin: 1.6rem 0 .8rem;
  }

  .denom-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: .7rem;
  }

  .denom-card {
    position: relative;
    background: var(--black);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: .9rem .7rem .7rem;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background .1s, border-color .1s, transform .08s;
  }
  .denom-card:hover { background: var(--mid); border-color: #444; }
  .denom-card:active { transform: scale(.96); }
  .denom-card.has-count { border-color: var(--accent); }

  .denom-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: .03em;
  }
  .denom-count {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent);
    margin-top: .3rem;
    min-height: 1.3em;
  }
  .denom-subtotal {
    font-size: .62rem;
    color: var(--grey);
    margin-top: .2rem;
  }
  .denom-minus {
    position: absolute;
    top: -8px; right: -8px;
    width: 22px; height: 22px;
    line-height: 20px;
    border-radius: 50%;
    background: var(--mid);
    border: 1px solid var(--line);
    color: var(--grey);
    font-size: .85rem;
    opacity: 0;
    transition: opacity .1s;
  }
  .denom-card.has-count .denom-minus { opacity: 1; }
  .denom-minus:hover { background: #2a2a2a; color: var(--white); }

  .total-bar {
    margin-top: 2rem;
    padding: 1.3rem 1.2rem;
    background: var(--mid);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .8rem;
  }
  .total-label {
    font-size: .68rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--grey);
  }
  .total-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    color: var(--white);
  }

  .actions { display: flex; gap: .6rem; flex-wrap: wrap; }
  .btn {
    font-family: 'DM Mono', monospace;
    font-size: .75rem;
    letter-spacing: .04em;
    padding: .65rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--black);
    color: var(--white);
    cursor: pointer;
    transition: background .1s, border-color .1s;
  }
  .btn:hover { background: #2a2a2a; border-color: #444; }
  .btn.primary { background: var(--accent); color: var(--black); border-color: var(--accent); font-weight: 500; }
  .btn.primary:hover { background: #ffd633; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .caisse-bar {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-wrap: wrap;
    margin-bottom: 1.2rem;
    padding: .9rem 1rem;
    background: var(--mid);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .caisse-bar label {
    font-size: .62rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--grey);
  }
  .caisse-bar select {
    font-family: 'DM Mono', monospace;
    font-size: .78rem;
    padding: .5rem .7rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--black);
    color: var(--white);
    cursor: pointer;
    flex: 1 1 12rem;
    min-width: 0;
  }
  .caisse-bar .btn { padding: .5rem .8rem; }

  .caisse-toggle {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .68rem;
    color: var(--grey);
    cursor: pointer;
    margin-bottom: .8rem;
  }
  .caisse-toggle input { cursor: pointer; accent-color: var(--accent); }

  .caisse-pick {
    font-family: 'DM Mono', monospace;
    font-size: .6rem;
    letter-spacing: .04em;
    color: var(--grey);
    background: var(--black);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: .2rem .3rem;
    margin-left: .6rem;
    max-width: 11rem;
    vertical-align: middle;
    cursor: pointer;
  }
  .caisse-pick:hover { color: var(--white); border-color: #444; }

  .history-status {
    font-size: .68rem;
    color: var(--accent);
    margin-bottom: .6rem;
    min-height: 1.2em;
  }

  .history-list { display: flex; flex-direction: column; gap: .6rem; }
  .history-empty { color: var(--grey); font-size: .8rem; padding: 1rem 0; }

  .history-item {
    background: var(--black);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: .8rem 1rem;
  }
  .history-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .8rem;
    flex-wrap: wrap;
  }
  .history-total {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    color: var(--accent);
  }
  .history-date {
    font-size: .68rem;
    color: var(--grey);
    letter-spacing: .03em;
  }
  .history-breakdown {
    margin-top: .5rem;
    font-size: .68rem;
    color: var(--grey);
    line-height: 1.6;
  }
  .history-del {
    background: none;
    border: none;
    color: var(--grey);
    font-size: .68rem;
    cursor: pointer;
    text-decoration: underline;
    margin-top: .5rem;
  }
  .history-del:hover { color: var(--white); }

  footer {
    text-align: center;
    margin-top: 3rem;
    font-size: .6rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--grey);
  }

  .loading-screen, .auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 4rem 1rem;
  }
  .auth-screen h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: .06em;
    margin: 1rem 0 1.6rem;
  }
  .auth-spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .provider-btn {
    display: flex;
    align-items: center;
    gap: .6rem;
    font-family: 'DM Mono', monospace;
    font-size: .8rem;
    padding: .75rem 1.4rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--black);
    color: var(--white);
    cursor: pointer;
    transition: border-color .1s, background .1s;
  }
  .provider-btn:hover { border-color: var(--accent); background: var(--mid); }
  .provider-btn:disabled { opacity: .5; cursor: not-allowed; }
  .provider-btn svg { width: 16px; height: 16px; background: #fff; border-radius: 2px; padding: 2px; flex-shrink: 0; }
  .auth-error {
    color: #ff6b6b;
    font-size: .72rem;
    margin-top: .9rem;
    min-height: 1.2em;
  }
  .auth-legal {
    color: var(--grey);
    font-size: .65rem;
    margin-top: 1.6rem;
    max-width: 340px;
  }
  .sync-note {
    color: var(--grey);
    font-size: .65rem;
    margin-top: .6rem;
    max-width: 320px;
  }
  .user-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    /* Le header pose déjà 2rem sous le titre : sans cette remontée, la barre
       flottait loin du nom du site et collait à la barre de caisse, comme si
       elle lui appartenait. */
    margin-top: -1.1rem;
    margin-bottom: 1.9rem;
    font-size: .7rem;
    line-height: 1;
    color: var(--grey);
  }
  .user-bar img {
    display: block;
    width: 22px; height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
  }
  .user-bar span { line-height: 1; }
  .user-bar button {
    padding: 0;
    background: none;
    border: none;
    color: var(--grey);
    font-family: 'DM Mono', monospace;
    font-size: .68rem;
    line-height: 1;
    text-decoration: underline;
    cursor: pointer;
  }
  .user-bar button:hover { color: var(--white); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <a class="backlink" href="/">← stucom</a>

  <header>
    <div id="app-logo">Compte Monnaie</div>
    <div id="app-sub">Clique pour compter tes pièces et billets</div>
  </header>

  <div class="loading-screen" id="loading-screen">
    <div class="auth-spinner"></div>
  </div>

  <div class="auth-screen" id="auth-screen" hidden>
    <span style="font-size:2.4rem;">💰</span>
    <h1>Connecte-toi pour continuer</h1>
    <button type="button" id="google-login-btn" class="provider-btn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
      Continuer avec Google
    </button>
    <div class="auth-error" id="auth-error"></div>
    <p class="sync-note">Ton historique est synchronisé sur ton compte Google et disponible sur tous tes appareils.</p>
  </div>

  <div id="app-content" hidden>
    <div class="user-bar" id="user-bar"></div>

    <div class="caisse-bar">
      <label for="caisse-select">Caisse</label>
      <select id="caisse-select"></select>
      <button type="button" class="btn" id="new-caisse-btn">+ Nouvelle</button>
      <button type="button" class="btn" id="rename-caisse-btn">Renommer</button>
    </div>

    <h3 class="section-title">Billets</h3>
    <div class="denom-grid" id="billets-grid"></div>

    <h3 class="section-title">Pièces</h3>
    <div class="denom-grid" id="pieces-grid"></div>

    <div class="total-bar">
      <div>
        <div class="total-label">Total actuel</div>
        <div class="total-value" id="total-value">0,00 €</div>
      </div>
      <div class="actions">
        <button class="btn" id="reset-btn">Réinitialiser</button>
        <button class="btn primary" id="save-btn" disabled>Enregistrer</button>
      </div>
    </div>

    <h3 class="section-title">Historique</h3>
    <label class="caisse-toggle">
      <input type="checkbox" id="show-all-caisses">
      Voir toutes les caisses
    </label>
    <div class="actions" style="margin-bottom:.5rem;">
      <button class="btn" id="download-excel-btn">📥 Télécharger Excel</button>
      <button class="btn" id="drive-export-btn">☁️ Enregistrer sur Drive</button>
      <button class="btn" id="clear-history-btn">Effacer l'historique</button>
    </div>
    <div class="sync-note" id="export-status" style="margin:0 0 .8rem;"></div>
    <div class="history-status" id="history-status"></div>
    <div class="history-list" id="history-list"></div>
  </div>

  <footer>stucom · money-clicker</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="/comb2/assets/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const BILLETS = [100, 50, 20, 10, 5];
  const PIECES = [2, 1, 0.5, 0.2, 0.1, 0.05];

  let counts = {};
  [...BILLETS, ...PIECES].forEach(v => counts[v] = 0);

  let currentUser = null;
  let storageKey = 'stucom-compte-monnaie-history';
  let caissesKey = 'stucom-compte-monnaie-caisses';
  let selectedCaisseKey = 'stucom-compte-monnaie-caisse-courante';
  let currentHistory = [];

  // Les comptages enregistrés avant l'ajout des caisses n'ont pas de
  // caisseId : ils sont rattachés à la caisse par défaut à la lecture,
  // plutôt que réécrits en masse dans Firestore.
  const DEFAULT_CAISSE_ID = 'default';
  const DEFAULT_CAISSE = { id: DEFAULT_CAISSE_ID, name: 'Caisse principale' };
  let caisses = [DEFAULT_CAISSE];
  let currentCaisseId = DEFAULT_CAISSE_ID;

  function caisseIdOf(entry) {
    return entry.caisseId || DEFAULT_CAISSE_ID;
  }

  function caisseName(id) {
    const c = caisses.find(x => x.id === id);
    return c ? c.name : 'Caisse supprimée';
  }

  function showingAllCaisses() {
    const el = document.getElementById('show-all-caisses');
    return !!(el && el.checked);
  }

  function visibleHistory() {
    if (showingAllCaisses()) return currentHistory;
    return currentHistory.filter(e => caisseIdOf(e) === currentCaisseId);
  }

  function fmt(n) {
    return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }

  function buildGrid(container, values) {
    values.forEach(v => {
      const card = document.createElement('div');
      card.className = 'denom-card';
      card.dataset.value = v;
      card.innerHTML = `
        <button class="denom-minus" data-value="${v}">−</button>
        <div class="denom-value">${fmt(v)}</div>
        <div class="denom-count" data-count="${v}">0</div>
        <div class="denom-subtotal" data-subtotal="${v}">0,00 €</div>
      `;
      card.addEventListener('click', (e) => {
        if (e.target.closest('.denom-minus')) return;
        counts[v]++;
        render();
      });
      card.querySelector('.denom-minus').addEventListener('click', (e) => {
        e.stopPropagation();
        if (counts[v] > 0) counts[v]--;
        render();
      });
      container.appendChild(card);
    });
  }

  buildGrid(document.getElementById('billets-grid'), BILLETS);
  buildGrid(document.getElementById('pieces-grid'), PIECES);

  function render() {
    let total = 0;
    [...BILLETS, ...PIECES].forEach(v => {
      const c = counts[v];
      total += c * v;
      document.querySelector(`[data-count="${v}"]`).textContent = c;
      document.querySelector(`[data-subtotal="${v}"]`).textContent = fmt(c * v);
      document.querySelector(`.denom-card[data-value="${v}"]`).classList.toggle('has-count', c > 0);
    });
    document.getElementById('total-value').textContent = fmt(total);
    document.getElementById('save-btn').disabled = total === 0;
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    [...BILLETS, ...PIECES].forEach(v => counts[v] = 0);
    render();
  });

  function userDoc() {
    return AuthGate.getDb().collection('moneyClicker').doc(currentUser.uid);
  }

  function entriesCollection() {
    return userDoc().collection('entries');
  }

  function caissesCollection() {
    return userDoc().collection('caisses');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function readLocalCaisses() {
    try {
      const parsed = JSON.parse(localStorage.getItem(caissesKey));
      return Array.isArray(parsed) && parsed.length ? parsed : [DEFAULT_CAISSE];
    } catch {
      return [DEFAULT_CAISSE];
    }
  }

  function writeLocalCaisses(list) {
    localStorage.setItem(caissesKey, JSON.stringify(list));
  }

  // La caisse par défaut est toujours présente : c'est elle qui porte les
  // comptages enregistrés avant l'existence des caisses.
  function mergeCaisses(local, server) {
    const byId = new Map([[DEFAULT_CAISSE_ID, DEFAULT_CAISSE]]);
    local.forEach(c => byId.set(c.id, c));
    server.forEach(c => byId.set(c.id, c));
    return [...byId.values()];
  }

  function renderCaisseSelect() {
    const select = document.getElementById('caisse-select');
    select.innerHTML = caisses
      .map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`)
      .join('');
    select.value = currentCaisseId;
  }

  function setCurrentCaisse(id) {
    currentCaisseId = id;
    try { localStorage.setItem(selectedCaisseKey, id); } catch { /* stockage indisponible */ }
    renderCaisseSelect();
    renderHistory(currentHistory);
  }

  function loadCaisses() {
    caisses = readLocalCaisses();
    let stored = null;
    try { stored = localStorage.getItem(selectedCaisseKey); } catch { /* stockage indisponible */ }
    currentCaisseId = caisses.some(c => c.id === stored) ? stored : DEFAULT_CAISSE_ID;
    renderCaisseSelect();

    return caissesCollection().get()
      .then(snap => {
        const server = [];
        snap.forEach(doc => {
          const d = doc.data();
          server.push({ id: d.id, name: d.name });
        });
        caisses = mergeCaisses(caisses, server);
        writeLocalCaisses(caisses);
        if (!caisses.some(c => c.id === currentCaisseId)) currentCaisseId = DEFAULT_CAISSE_ID;
        renderCaisseSelect();
      })
      .catch(err => console.warn('Lecture des caisses échouée (liste locale conservée) :', err));
  }

  function saveCaisse(caisse) {
    return caissesCollection().doc(caisse.id)
      .set({ id: caisse.id, name: caisse.name })
      .catch(err => console.warn('Sync caisse échouée (gardée en local) :', err));
  }

  function readLocalHistory() {
    try {
      return JSON.parse(localStorage.getItem(storageKey)) || [];
    } catch {
      return [];
    }
  }

  function writeLocalHistory(history) {
    localStorage.setItem(storageKey, JSON.stringify(history));
  }

  function renderHistory(history) {
    currentHistory = history;
    const list = document.getElementById('history-list');
    const shown = visibleHistory();
    list.innerHTML = '';
    if (shown.length === 0) {
      list.innerHTML = history.length === 0
        ? '<div class="history-empty">Aucun comptage enregistré pour l\'instant.</div>'
        : '<div class="history-empty">Aucun comptage pour cette caisse. Coche « Voir toutes les caisses » pour afficher les autres.</div>';
      return;
    }
    shown.slice().reverse().forEach(entry => {
      const item = document.createElement('div');
      item.className = 'history-item';
      const breakdown = [...BILLETS, ...PIECES]
        .filter(v => entry.counts[v] > 0)
        .map(v => `${fmt(v)} × ${entry.counts[v]}`)
        .join(' · ');
      // Le sélecteur est présent sur chaque comptage, y compris les anciens :
      // c'est le seul moyen de rattacher à une caisse un comptage enregistré
      // avant l'existence des caisses.
      const options = caisses.map(c => (
        `<option value="${escapeHtml(c.id)}"${c.id === caisseIdOf(entry) ? ' selected' : ''}>${escapeHtml(c.name)}</option>`
      )).join('');
      item.innerHTML = `
        <div class="history-top">
          <span class="history-total">${fmt(entry.total)}<select class="caisse-pick" title="Caisse de ce comptage">${options}</select></span>
          <span class="history-date">${entry.date}</span>
        </div>
        <div class="history-breakdown">${breakdown || 'Aucune coupure'}</div>
        <button class="history-del" data-id="${entry.id}">Supprimer</button>
      `;
      item.querySelector('.caisse-pick').addEventListener('click', e => e.stopPropagation());
      item.querySelector('.caisse-pick').addEventListener('change', (e) => {
        moveEntry(entry, e.target.value);
      });
      item.querySelector('.history-del').addEventListener('click', () => {
        const h = readLocalHistory().filter(e => e.id !== entry.id);
        writeLocalHistory(h);
        renderHistory(h);
        if (entry.fsId) {
          entriesCollection().doc(entry.fsId).delete()
            .catch(err => console.warn('Suppression Firestore échouée :', err));
        }
      });
      list.appendChild(item);
    });
  }

  let historyStatusTimer = null;
  function setHistoryStatus(msg) {
    const el = document.getElementById('history-status');
    if (!el) return;
    el.textContent = msg;
    clearTimeout(historyStatusTimer);
    historyStatusTimer = setTimeout(() => { el.textContent = ''; }, 4000);
  }

  function moveEntry(entry, caisseId) {
    if (caisseIdOf(entry) === caisseId) return;
    const moved = currentHistory.map(e => (
      String(e.id) === String(entry.id) ? Object.assign({}, e, { caisseId, caissePending: true }) : e
    ));
    writeLocalHistory(moved);
    renderHistory(moved);
    setHistoryStatus('Comptage déplacé vers « ' + caisseName(caisseId) + ' ».');

    if (!entry.fsId) return;
    entriesCollection().doc(entry.fsId).update({ caisseId })
      .then(() => {
        // Confirmé côté serveur : le marqueur peut tomber.
        const synced = readLocalHistory().map(e => (
          String(e.id) === String(entry.id) ? Object.assign({}, e, { caissePending: false }) : e
        ));
        writeLocalHistory(synced);
      })
      .catch(err => console.warn('Déplacement Firestore échoué (gardé en local) :', err));
  }

  // Fusionne serveur + local sur la clé `id`. Auparavant la réponse serveur
  // (limitée aux 50 derniers) remplaçait purement l'historique local : tout
  // comptage plus ancien, ou enregistré hors ligne et pas encore synchronisé,
  // était définitivement perdu au premier chargement de page.
  function mergeHistories(local, server) {
    const byId = new Map();
    local.forEach(e => byId.set(String(e.id), e));
    server.forEach(e => {
      const existing = byId.get(String(e.id));
      if (!existing) { byId.set(String(e.id), e); return; }
      const merged = Object.assign({}, existing, e);
      // Un déplacement de caisse pas encore confirmé par le serveur ne doit
      // pas être écrasé par la valeur d'avant le déplacement.
      if (existing.caissePending) {
        merged.caisseId = existing.caisseId;
        merged.caissePending = true;
      }
      byId.set(String(e.id), merged);
    });
    return [...byId.values()].sort((a, b) => Number(a.id) - Number(b.id));
  }

  function loadHistory() {
    const local = readLocalHistory();
    renderHistory(local);

    entriesCollection().orderBy('ts', 'desc').limit(200).get()
      .then(snap => {
        const serverHistory = [];
        snap.forEach(doc => {
          const d = doc.data();
          serverHistory.push({ id: d.id, fsId: doc.id, total: d.total, counts: d.counts, date: d.date, caisseId: d.caisseId || DEFAULT_CAISSE_ID });
        });
        const merged = mergeHistories(local, serverHistory);
        writeLocalHistory(merged);
        renderHistory(merged);
      })
      .catch(err => console.warn('Lecture Firestore échouée (historique local conservé) :', err));
  }

  document.getElementById('caisse-select').addEventListener('change', (e) => {
    setCurrentCaisse(e.target.value);
  });

  document.getElementById('show-all-caisses').addEventListener('change', () => {
    renderHistory(currentHistory);
  });

  document.getElementById('new-caisse-btn').addEventListener('click', () => {
    const name = (prompt('Nom de la nouvelle caisse ?') || '').trim();
    if (!name) return;
    if (caisses.some(c => c.name.toLowerCase() === name.toLowerCase())) {
      alert('Une caisse porte déjà ce nom.');
      return;
    }
    const caisse = { id: 'c' + Date.now(), name };
    caisses.push(caisse);
    writeLocalCaisses(caisses);
    setCurrentCaisse(caisse.id);
    saveCaisse(caisse);
  });

  document.getElementById('rename-caisse-btn').addEventListener('click', () => {
    const caisse = caisses.find(c => c.id === currentCaisseId);
    if (!caisse) return;
    const name = (prompt('Nouveau nom de la caisse ?', caisse.name) || '').trim();
    if (!name || name === caisse.name) return;
    if (caisses.some(c => c.id !== caisse.id && c.name.toLowerCase() === name.toLowerCase())) {
      alert('Une caisse porte déjà ce nom.');
      return;
    }
    // Les comptages référencent la caisse par son id : renommer suffit,
    // aucun historique n'a besoin d'être réécrit.
    caisse.name = name;
    writeLocalCaisses(caisses);
    renderCaisseSelect();
    renderHistory(currentHistory);
    saveCaisse(caisse);
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    const total = [...BILLETS, ...PIECES].reduce((sum, v) => sum + counts[v] * v, 0);
    if (total === 0) return;
    const now = new Date();
    const entry = {
      id: Date.now(),
      total,
      counts: { ...counts },
      caisseId: currentCaisseId,
      date: now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    };
    const history = readLocalHistory();
    history.push(entry);
    writeLocalHistory(history);
    [...BILLETS, ...PIECES].forEach(v => counts[v] = 0);
    render();
    renderHistory(history);

    entriesCollection().add({
      id: entry.id,
      total: entry.total,
      counts: entry.counts,
      caisseId: entry.caisseId,
      date: entry.date,
      ts: firebase.firestore.FieldValue.serverTimestamp()
    }).then(docRef => {
      entry.fsId = docRef.id;
      writeLocalHistory(history);
    }).catch(err => console.warn('Sync Firestore échouée (comptage gardé en local) :', err));
  });

  document.getElementById('clear-history-btn').addEventListener('click', () => {
    // L'effacement suit ce qui est affiché : la caisse courante seule, ou
    // toutes les caisses si la case correspondante est cochée.
    const all = showingAllCaisses();
    const scope = currentCaisseId;
    const question = all
      ? 'Effacer les comptages de TOUTES les caisses ?'
      : 'Effacer les comptages de la caisse « ' + caisseName(currentCaisseId) + ' » ?';
    if (!confirm(question)) return;

    const kept = all ? [] : currentHistory.filter(e => caisseIdOf(e) !== scope);
    writeLocalHistory(kept);
    renderHistory(kept);
    entriesCollection().get()
      .then(snap => {
        // Un batch Firestore accepte au maximum 500 opérations : au-delà le
        // commit échouait en bloc et rien n'était supprimé côté serveur.
        const refs = [];
        snap.forEach(doc => {
          const d = doc.data();
          if (all || (d.caisseId || DEFAULT_CAISSE_ID) === scope) refs.push(doc.ref);
        });
        const db = AuthGate.getDb();
        let chain = Promise.resolve();
        for (let i = 0; i < refs.length; i += 400) {
          const chunk = refs.slice(i, i + 400);
          chain = chain.then(() => {
            const batch = db.batch();
            chunk.forEach(ref => batch.delete(ref));
            return batch.commit();
          });
        }
        return chain;
      })
      .catch(err => console.warn('Suppression Firestore échouée :', err));
  });

  function splitDateTime(dateStr) {
    const idx = dateStr.indexOf(' ');
    return idx === -1 ? [dateStr, ''] : [dateStr.slice(0, idx), dateStr.slice(idx + 1)];
  }

  function buildWorkbookData() {
    const denoms = [...BILLETS, ...PIECES];
    const header = ['Caisse', 'Date', 'Heure', 'Total (€)', ...denoms.map(v => fmt(v))];
    const rows = visibleHistory().map(entry => {
      const [date, heure] = splitDateTime(entry.date);
      return [caisseName(caisseIdOf(entry)), date, heure, entry.total, ...denoms.map(v => entry.counts[v] || 0)];
    });
    return [header, ...rows];
  }

  function slug(str) {
    return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'caisse';
  }

  function exportFilename() {
    return showingAllCaisses()
      ? 'compte-monnaie-toutes-caisses.xlsx'
      : 'compte-monnaie-' + slug(caisseName(currentCaisseId)) + '.xlsx';
  }

  function buildWorkbook() {
    const ws = XLSX.utils.aoa_to_sheet(buildWorkbookData());
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Historique');
    return wb;
  }

  const exportStatus = document.getElementById('export-status');
  const downloadExcelBtn = document.getElementById('download-excel-btn');
  const driveExportBtn = document.getElementById('drive-export-btn');

  downloadExcelBtn.addEventListener('click', () => {
    if (visibleHistory().length === 0) {
      exportStatus.textContent = 'Aucun comptage à exporter pour cette sélection.';
      return;
    }
    exportStatus.textContent = '';
    XLSX.writeFile(buildWorkbook(), exportFilename());
  });

  function requestDriveAccessToken() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('https://www.googleapis.com/auth/drive.file');
    // Sans prompt=consent, Google peut renvoyer un résultat sans nouveau
    // credential (donc sans accessToken) ; login_hint évite en plus de
    // basculer silencieusement sur un autre compte Google que celui connecté.
    const params = { prompt: 'consent' };
    if (currentUser && currentUser.email) params.login_hint = currentUser.email;
    provider.setCustomParameters(params);
    return AuthGate.getAuth().signInWithPopup(provider)
      .then(result => {
        const token = result && result.credential && result.credential.accessToken;
        if (!token) throw new Error("Google n'a pas renvoyé d'autorisation Drive.");
        return token;
      });
  }

  function uploadToDrive(accessToken, blob, filename) {
    const metadata = { name: filename, mimeType: blob.type };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + accessToken },
      body: form
    }).then(r => {
      if (!r.ok) throw new Error('Réponse Drive : ' + r.status);
      return r.json();
    });
  }

  driveExportBtn.addEventListener('click', () => {
    if (visibleHistory().length === 0) {
      exportStatus.textContent = 'Aucun comptage à exporter pour cette sélection.';
      return;
    }
    driveExportBtn.disabled = true;
    exportStatus.textContent = 'Connexion à Google Drive...';
    requestDriveAccessToken()
      .then(token => {
        exportStatus.textContent = 'Envoi vers Google Drive...';
        const wbout = XLSX.write(buildWorkbook(), { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        return uploadToDrive(token, blob, exportFilename());
      })
      .then(() => {
        exportStatus.textContent = 'Enregistré sur Google Drive ✓';
      })
      .catch(err => {
        console.warn('Export Drive échoué :', err);
        exportStatus.textContent = "Échec de l'enregistrement sur Drive — réessaie.";
      })
      .finally(() => { driveExportBtn.disabled = false; });
  });

  function authErrorMessage(e) {
    const msgs = {
      'auth/popup-closed-by-user': "Fenêtre de connexion fermée avant la fin.",
      'auth/popup-blocked': "Le navigateur a bloqué la fenêtre de connexion — autorise les popups pour ce site.",
      'auth/unauthorized-domain': "Ce domaine n'est pas encore autorisé pour la connexion Google (à configurer côté Firebase).",
      'auth/network-request-failed': "Le service de connexion Google est injoignable (réseau, ou service momentanément indisponible). Réessaie dans un instant.",
      'auth/internal-error': "Le service de connexion Google a renvoyé une erreur interne. Réessaie dans un instant.",
      'auth/too-many-requests': "Trop de tentatives de connexion — patiente une minute avant de réessayer.",
      'auth/web-storage-unsupported': "Ton navigateur bloque le stockage nécessaire à la connexion (mode privé ou blocage des cookies tiers)."
    };
    const base = msgs[e.code] || (e.message || 'Connexion impossible, réessaie.');
    // Toujours exposer le code brut : sans lui, une panne côté service était
    // indiscernable d'une simple erreur utilisateur.
    return e.code ? base + ' [' + e.code + ']' : base;
  }

  const loadingScreen = document.getElementById('loading-screen');
  const authScreen = document.getElementById('auth-screen');
  const appContent = document.getElementById('app-content');
  const authError = document.getElementById('auth-error');
  const googleLoginBtn = document.getElementById('google-login-btn');

  googleLoginBtn.addEventListener('click', () => {
    googleLoginBtn.disabled = true;
    authError.textContent = 'Redirection vers Google...';
    AuthGate.signInGoogleRedirect().catch(e => {
      authError.textContent = authErrorMessage(e);
      googleLoginBtn.disabled = false;
    });
  });

  function showFatalAuthError(msg) {
    loadingScreen.hidden = true;
    authScreen.hidden = false;
    appContent.hidden = true;
    authError.textContent = msg;
  }

  const UNREACHABLE_MSG = "Le service de connexion Google n'a pas pu se charger (réseau, ou bloqueur de contenu). Vérifie ta connexion et recharge la page.";
  let authResolved = false;
  const authTimeout = setTimeout(() => {
    if (!authResolved) showFatalAuthError(UNREACHABLE_MSG);
  }, 8000);

  try {
    AuthGate.getAuth().getRedirectResult().catch(e => {
      authError.textContent = authErrorMessage(e);
    });
  } catch (e) {
    console.warn('Firebase indisponible :', e);
    showFatalAuthError(UNREACHABLE_MSG);
  }

  render();

  try {
    AuthGate.onReady(user => {
      authResolved = true;
      clearTimeout(authTimeout);
      loadingScreen.hidden = true;
      if (!user) {
        authScreen.hidden = false;
        appContent.hidden = true;
        currentUser = null;
        return;
      }
      authScreen.hidden = true;
      appContent.hidden = false;
      currentUser = user;
      storageKey = 'stucom-compte-monnaie-history_' + user.uid;
      caissesKey = 'stucom-compte-monnaie-caisses_' + user.uid;
      selectedCaisseKey = 'stucom-compte-monnaie-caisse-courante_' + user.uid;

      document.getElementById('user-bar').innerHTML = `
        ${user.photoURL ? `<img src="${user.photoURL}" alt="">` : ''}
        <span>${user.displayName || user.email || ''}</span>
        <button type="button" id="logout-btn">Se déconnecter</button>
      `;
      document.getElementById('logout-btn').addEventListener('click', () => {
        AuthGate.signOut().catch(() => {});
      });

      // Les caisses d'abord : l'historique en dépend pour son filtrage.
      loadCaisses().then(() => {
        renderHistory(currentHistory);
        loadHistory();
      });
    });
  } catch (e) {
    console.warn('Firebase indisponible :', e);
    showFatalAuthError(UNREACHABLE_MSG);
  }
</script>

</body>
</html>
