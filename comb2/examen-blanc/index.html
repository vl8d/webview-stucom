<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examens Blancs — stucom</title>
    <meta name="description" content="Plateforme d'examens blancs interactifs : choisis ton cours et entraîne-toi.">
    <link rel="stylesheet" href="../assets/quiz-engine.css">
</head>
<body>

<div id="hub-app"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/quiz-engine.js"></script>
<script>
    const COURSES = [
        {
            id: 'institutions-politiques-publiques',
            href: 'institutions-politiques-publiques/',
            icon: '🏛️',
            accent: '#00E5FF',
            title: 'Institutions & Politiques Publiques',
            description: "La Belgique institutionnelle, le paysage politique et les politiques culturelles. 100 questions, 5 niveaux.",
            count: 100
        },
        {
            id: 'philosophie-medias-communication',
            href: 'philosophie-medias-communication/',
            icon: '🪞',
            accent: '#FF2E9A',
            title: 'Philosophie des médias et de la communication',
            description: "Identité, Éros/Philia, Heidegger et la technique, Kulturindustrie, Black Mirror... 100 questions, 5 niveaux.",
            count: 100
        }
    ];

    const root = document.getElementById('hub-app');

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderLoading() {
        root.innerHTML = `
            <div class="container">
                <div class="auth-screen">
                    <span class="quiz-icon">🎓</span>
                    <div class="auth-spinner" style="margin-top:20px;"></div>
                </div>
            </div>
        `;
    }

    function renderLogin() {
        root.innerHTML = `
            <div class="container">
                <div class="auth-screen">
                    <span class="quiz-icon">🎓</span>
                    <h1>Examens Blancs</h1>
                    <p>Connecte-toi pour accéder aux cours et retrouver tes scores sur tous tes appareils.</p>
                    ${QuizEngine.authButtonsHtml()}
                    <div class="auth-error" id="authError"></div>
                </div>
            </div>
        `;
        const errBox = document.getElementById('authError');
        QuizEngine.wireLoginButton(document, '#googleLoginBtn', () => AuthGate.signInGoogle(), errBox);
        QuizEngine.wireLoginButton(document, '#msLoginBtn', () => AuthGate.signInMicrosoft(), errBox);
    }

    function renderHub(user) {
        root.innerHTML = `
            <div class="container">
                <header class="quiz-header">
                    <div class="top-bar">
                        <span></span>
                        <div class="user-bar">
                            ${user.photoURL ? `<img src="${user.photoURL}" alt="">` : ''}
                            <span>${escapeHtml(user.displayName || user.email || '')}</span>
                            <button type="button" id="logoutBtn">Se déconnecter</button>
                        </div>
                    </div>
                    <span class="quiz-icon">🎓</span>
                    <h1 class="quiz-title"><span>Examens</span> Blancs</h1>
                    <h2 class="quiz-subtitle">Choisis ton cours</h2>
                </header>

                <div class="hub-grid" id="hubGrid"></div>

                <footer class="quiz-footer">stucom · examens blancs interactifs</footer>
            </div>
        `;

        document.getElementById('logoutBtn').addEventListener('click', () => {
            AuthGate.signOut().catch(() => {});
        });

        const grid = document.getElementById('hubGrid');
        grid.innerHTML = COURSES.map(c => `
            <a class="hub-card" href="${c.href}" style="--hub-accent:${c.accent}">
                <span class="hub-icon">${c.icon}</span>
                <h3>${escapeHtml(c.title)}</h3>
                <p>${escapeHtml(c.description)}</p>
                <div class="hub-meta">
                    <span id="meta-${c.id}">${c.count} questions</span>
                    <span class="hub-cta">Commencer →</span>
                </div>
            </a>
        `).join('');

        // Meilleur score par cours, une fois les données Firestore disponibles (non bloquant).
        COURSES.forEach(c => {
            AuthGate.scoresCollection(user.uid, c.id).get().then(snap => {
                let best = null;
                snap.forEach(doc => {
                    const d = doc.data();
                    const pct = d.pct !== undefined ? d.pct : Math.round((d.score / d.total) * 100);
                    if (best === null || pct > best) best = pct;
                });
                if (best !== null) {
                    const el = document.getElementById('meta-' + c.id);
                    if (el) el.textContent = `${c.count} questions · 🏆 ${best}%`;
                }
            }).catch(err => console.warn('Lecture des scores échouée :', err));
        });
    }

    renderLoading();
    AuthGate.onReady(user => {
        if (!user) { renderLogin(); return; }
        renderHub(user);
    });
</script>

</body>
</html>
